<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Ensure Nerd Font icons are found before generic fallbacks -->
  <alias>
    <family>JetBrainsMono Nerd Font</family>
    <default><family>monospace</family></default>
  </alias>
  <alias>
    <family>JetBrains Mono NF</family>
    <default><family>monospace</family></default>
  </alias>
  <alias>
    <family>MesloLGS Nerd Font</family>
    <default><family>monospace</family></default>
  </alias>

  <!-- Material Symbols: quickshell icon font (RAM/Swap/CPU/media/battery etc.) -->
  <alias>
    <family>Material Symbols Rounded</family>
    <default><family>sans-serif</family></default>
  </alias>
  <alias>
    <family>Material Symbols Outlined</family>
    <default><family>sans-serif</family></default>
  </alias>

  <!-- Google Sans Flex: quickshell main UI font -->
  <alias>
    <family>Google Sans Flex</family>
    <default><family>sans-serif</family></default>
  </alias>

  <!-- Match icon codepoints to Nerd Fonts -->
  <match target="scan">
    <test name="family" compare="eq">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
  </match>

  <!-- Emoji fallback: prefer Noto Emoji -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
